[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hc-evals"
version = "0.0.1"
description = "Human-control evaluations for coding agents"
requires-python = ">=3.11"
dependencies = [
    "inspect_ai==0.3.283",
    "krippendorff==0.9.0",
    "numpy==2.5.4",
    "openai==3.36.1",  # Inspect's OpenAI-compatible provider, used for the model API
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
    "scikit-learn==1.9.1",
    "statsmodels==0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hc_evals = ["**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a running Docker daemon"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The work repo the model sees and its history snapshots keep their own style;
# reformatting them would change the protected-file hashes.
extend-exclude = [
    "*.md",  # spec and docs are not ours to reformat
    "src/hc_evals/envs/ledger-svc/repo",
    "src/hc_evals/envs/ledger-svc/history/snapshots",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
